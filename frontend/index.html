<meta charset="utf-8" />
<title>緊急連絡先登録ポータル</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.2rem; }
  label { display: block; margin-top: 10px; font-size: 0.85rem; color: #333; }
  input { width: 100%; padding: 6px; box-sizing: border-box; font-size: 1rem; }
  input[readonly] { background: #eee; }
  button { margin-top: 16px; padding: 8px 16px; font-size: 1rem; }
  #message { margin-top: 12px; color: #b00; white-space: pre-wrap; }
  #profile-section { display: none; }
  #phone-note { font-size: 0.82rem; color: #555; margin-top: 8px; }
  #updated-at { font-size: 0.85rem; color: #555; margin-left: 12px; }

  .field-group {
    margin-top: 20px;
    padding: 12px 14px 16px;
    border-radius: 6px;
    border-top: 3px solid transparent;
  }
  .field-group h2 {
    font-size: 0.95rem;
    margin: 0 0 4px;
  }
  .field-group:nth-of-type(1) {
    background: #f5f6f8;
    border-top-color: #6b7684;
  }
  .field-group:nth-of-type(2) {
    background: #fff6e9;
    border-top-color: #d9922c;
  }
  .field-group:nth-of-type(3) {
    background: #eef6ff;
    border-top-color: #3b7dd8;
  }
</style>

<h1>緊急連絡先登録ポータル</h1>
<p id="phone-note">
  ・電話番号は個人所有（会社貸与ではなく）を入力してください<br>
  ・変更箇所を入力後、画面下の「変更する」を押してください
</p>
<div id="message"></div>

<div id="login-section">
  <label>社員番号
    <input id="login-username" autocomplete="username" />
  </label>
  <label>パスワード
    <input id="login-password" type="password" autocomplete="current-password" />
  </label>
  <button id="login-button">ログイン</button>
</div>

<div id="profile-section">
  <form id="profile-form"></form>
  <button id="save-button">変更する</button>
  <button id="logout-button" type="button">ログアウト</button>
  <span id="updated-at">変更日時: <span id="updated-at-value">-</span></span>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
