AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Employee information portal (S3 static hosting + API Gateway + Lambda + DynamoDB + Cognito).
  CSV import (keyed by employee number) / self-service view & edit / CSV export (manual, by an admin).
  NOTE: this template's comments/descriptions are kept ASCII-only, and the two Japanese
  attribute-name literals below are written as XXXX escapes, because the AWS CLI on the
  deploying Windows machine fails to read non-ASCII template files (system codepage issue).
  The actual DynamoDB attribute names / env var values are still the Japanese words
  for "employee number" and "date of birth" (see AttributeName / PK_ATTRIBUTE_NAME
  and BIRTH_DATE_ATTRIBUTE_NAME below).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128

Parameters:
  DomainName:
    Type: String
    Default: portal.tokaiec.co.jp
  AcmCertificateArn:
    Type: String
    Description: Outputs.CertificateArn from infra/certificate.yaml (us-east-1)
  HostedZoneId:
    Type: String
    Description: Outputs.HostedZoneId from infra/hosted-zone.yaml
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Secret value CloudFront forwards to the S3 origin as a Referer header,
      used to block direct access to S3 (e.g. generate with `openssl rand -hex 16`).

Resources:

  # --------------------------------------------------------------------
  # DynamoDB: employee master table (PK = employee number attribute)
  # --------------------------------------------------------------------
  EmployeeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "\u793E\u54E1\u756A\u53F7"
          AttributeType: S
      KeySchema:
        - AttributeName: "\u793E\u54E1\u756A\u53F7"
          KeyType: HASH

  # --------------------------------------------------------------------
  # S3: bucket for the static frontend
  # --------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          # Only allow requests that carry the secret Referer header CloudFront adds,
          # so the S3 static website endpoint can't be accessed directly.
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebsiteBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:Referer: !Ref OriginVerifySecret

  # --------------------------------------------------------------------
  # CloudFront: HTTPS distribution for the custom domain portal.tokaiec.co.jp
  # Requires infra/hosted-zone.yaml and infra/certificate.yaml to be deployed first
  # --------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: WebsiteOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt WebsiteBucket.WebsiteURL]]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: Referer
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        # Fixed hosted zone ID for CloudFront alias targets, same in every region
        HostedZoneId: Z2FDTNDATAQYW2

  # --------------------------------------------------------------------
  # S3: bucket for CSV import/export (upload under incoming/ to trigger import)
  # --------------------------------------------------------------------
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      # Explicit name (instead of auto-generated) so the Lambda IAM policies below can
      # reference it as a plain string. Using !Ref DataBucket in those policies would add
      # a Role -> Bucket dependency edge that, combined with the S3 event notification's
      # Bucket -> Function edge, forms a circular dependency CloudFormation rejects.
      BucketName: !Sub "${AWS::StackName}-data-${AWS::AccountId}"

  # --------------------------------------------------------------------
  # Cognito: user pool for employee auth (username = employee number)
  # --------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: employee-portal-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          # Initial password is "employee number + date of birth" (digits only),
          # so upper/lowercase are not required.
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # --------------------------------------------------------------------
  # API Gateway (HTTP API) + Cognito JWT authorizer
  # --------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${DomainName}"
        AllowMethods:
          - GET
          - PUT
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # --------------------------------------------------------------------
  # Lambda: fetch the caller's own employee record
  # --------------------------------------------------------------------
  GetEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/get_employee/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref EmployeeTable
          PK_ATTRIBUTE_NAME: "\u793E\u54E1\u756A\u53F7"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmployeeTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: get

  # --------------------------------------------------------------------
  # Lambda: update the caller's own employee record
  # --------------------------------------------------------------------
  UpdateEmployeeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/update_employee/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref EmployeeTable
          PK_ATTRIBUTE_NAME: "\u793E\u54E1\u756A\u53F7"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeeTable
      Events:
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /me
            Method: put

  # --------------------------------------------------------------------
  # Lambda: CSV import (triggered by an upload under DataBucket's incoming/ prefix)
  # --------------------------------------------------------------------
  ImportCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/import_csv/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref EmployeeTable
          PK_ATTRIBUTE_NAME: "\u793E\u54E1\u756A\u53F7"
          BIRTH_DATE_ATTRIBUTE_NAME: "\u751F\u5E74\u6708\u65E5"
          USER_POOL_ID: !Ref UserPool
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EmployeeTable
        - S3ReadPolicy:
            BucketName: !Sub "${AWS::StackName}-data-${AWS::AccountId}"
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt UserPool.Arn
      Events:
        CsvUploaded:
          Type: S3
          Properties:
            Bucket: !Ref DataBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: incoming/

  # --------------------------------------------------------------------
  # Lambda: CSV export (run manually by an admin via `aws lambda invoke`)
  # --------------------------------------------------------------------
  ExportCsvFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/export_csv/
      Handler: app.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref EmployeeTable
          PK_ATTRIBUTE_NAME: "\u793E\u54E1\u756A\u53F7"
          DATA_BUCKET: !Sub "${AWS::StackName}-data-${AWS::AccountId}"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EmployeeTable
        - S3WritePolicy:
            BucketName: !Sub "${AWS::StackName}-data-${AWS::AccountId}"

Outputs:
  PortalURL:
    Description: HTTPS URL employees use to access the portal
    Value: !Sub "https://${DomainName}"
  WebsiteURL:
    Description: Underlying S3 static hosting URL (direct access is denied; only CloudFront's Referer header is accepted)
    Value: !GetAtt WebsiteBucket.WebsiteURL
  WebsiteBucketName:
    Description: Bucket to upload the frontend to
    Value: !Ref WebsiteBucket
  DataBucketName:
    Description: Bucket for CSV import/export (upload CSVs under incoming/)
    Value: !Ref DataBucket
  ApiUrl:
    Description: API Gateway endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client ID
    Value: !Ref UserPoolClient
  Region:
    Description: Deployed region
    Value: !Ref AWS::Region
