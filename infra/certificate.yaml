AWSTemplateFormatVersion: '2010-09-09'
Description: >
  portal.tokaiec.co.jp 用のACM証明書（CloudFrontで使うため us-east-1 に必ずデプロイする）。
  hosted-zone.yaml のデプロイ後、さくら側でNS委任が完了してから実行すること。

Parameters:
  DomainName:
    Type: String
    Default: portal.tokaiec.co.jp
  HostedZoneId:
    Type: String
    Description: hosted-zone.yaml の Outputs.HostedZoneId

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
